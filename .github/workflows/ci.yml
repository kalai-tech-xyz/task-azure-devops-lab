name: Azure DevOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pipeline-evaluation:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # STAGE 1: Code Quality
    - name: Lint with Flake8
      run: |
        pip install flake8
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics

    # STAGE 2: Security Scan (Gated step)
    - name: Run Trivy Security Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        exit-code: '1' # Forces failure when hardcoded secrets are caught
        severity: 'CRITICAL,HIGH'

    # STAGE 3: Unit Tests (Blocked by Stage 2)
    - name: Run Unit Tests
      run: |
        pip install flask pytest
        export PYTHONPATH=.
        pytest app/test_app.py

    # STAGE 4: Azure Authentication
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # STAGE 5: Infrastructure Deployment
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: ./terraform
